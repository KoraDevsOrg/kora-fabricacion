<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kora Fabricación</title>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (let r of regs) r.unregister();
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>
  <link rel="stylesheet" href="css/styles.css?v=20261001_1">
  <script src="https://cdn.jsdelivr.net/gh/KoraDevsOrg/kora-web-sdk@main/kora-sync.js?v=3.5.0"></script>
</head>
<body>

  <div id="drawerBackdrop" class="drawer-backdrop"></div>
  <aside id="sideDrawer" class="side-drawer"></aside>

  <header>
    <div class="header-left">
      <button id="btnOpenDrawer" class="btn-icon">☰</button>
      <h1 class="header-title" id="headerTitle">Kora Fabricación</h1>
    </div>
    <div class="offline-badge">100% Offline</div>
  </header>

  <main id="appContent"></main>

  <div id="appModalOverlay" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div id="modalIcon" style="font-size: 2rem; margin-bottom: 8px;">⚠️</div>
      <h3 id="modalTitle" style="color: #fff; margin-bottom: 6px; font-size: 1.1rem;">Aviso</h3>
      <p id="modalMsg" style="font-size: 0.85rem; color: var(--text-sub); line-height: 1.4; margin-bottom: 16px;"></p>
      <div id="modalActions" style="display: flex; gap: 8px; justify-content: flex-end;">
        <button id="btnModalClose" class="btn-primary" style="width: auto; padding: 8px 16px;">Entendido</button>
      </div>
    </div>
  </div>

  <!-- 1. HUB PRINCIPAL -->
  <template id="tmpl-home-view">
    <div class="hub-grid">
      <div class="hub-card" id="btnActionActiveOrders">
        <div class="hub-icon-badge icon-orange">⚡</div>
        <div class="hub-info">
          <div class="hub-title">Órdenes en Taller / Proceso</div>
          <div class="hub-desc">Ver órdenes en ejecución, cronometrar etapas en vivo y notificar avances.</div>
        </div>
      </div>

      <div class="hub-card" id="btnActionNewOrder">
        <div class="hub-icon-badge icon-green">➕</div>
        <div class="hub-info">
          <div class="hub-title">Crear Orden de Fabricación</div>
          <div class="hub-desc">Lanzar orden congelando snapshot de materiales y ruta operativa.</div>
        </div>
      </div>

      <div class="hub-card" id="btnActionRoutes">
        <div class="hub-icon-badge icon-blue">🗺</div>
        <div class="hub-info">
          <div class="hub-title">Rutas de Proceso & Pasos</div>
          <div class="hub-desc">Definir secuencias operativas y qué materias primas se consumen por etapa.</div>
        </div>
      </div>
    </div>
  </template>

  <!-- 2. TABLERO DE ÓRDENES -->
  <template id="tmpl-orders-view">
    <div class="card-header-bar" style="margin-bottom: 14px;">
      <h2 style="font-size: 1.1rem; color: #fff; font-weight: 800;">Órdenes de Trabajo</h2>
      <button type="button" class="btn-icon" id="btnBackHomeOrders">←</button>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 14px;">
      <button id="btnFilterActive" class="btn-secondary btn-sm active" style="flex: 1;">En Proceso</button>
      <button id="btnFilterDone" class="btn-secondary btn-sm" style="flex: 1;">Terminadas</button>
    </div>

    <div id="ordersCardsContainer" class="orders-list"></div>
  </template>

  <!-- 3. FORMULARIO NUEVA ORDEN -->
  <template id="tmpl-new-order-view">
    <div class="card">
      <div class="card-header-bar" style="margin-bottom: 14px;">
        <h2 class="card-title">Nueva Orden de Fabricación</h2>
        <button type="button" class="btn-icon" id="btnBackHomeNewOrder">←</button>
      </div>

      <form id="newOrderForm">
        <div class="form-group">
          <label>Identificador o Código de Seguimiento:</label>
          <input type="text" id="ordCodigo" class="input-field" required placeholder="Ej: LOTE-50, PLACA-XYZ123, PEDIDO-08">
        </div>

        <div class="form-group">
          <label>Ruta Operativa:</label>
          <select id="ordRutaId" class="input-field" required></select>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Cantidad a Producir / Lote:</label>
            <input type="number" step="any" id="ordCantidad" class="input-field" value="20" min="1" required>
          </div>
          <div class="form-group">
            <label>Tipo de Flujo:</label>
            <select id="ordTipoFlujo" class="input-field">
              <option value="VENTA_DIRECTA_LOTE">Producción en Lote para Vitrina</option>
              <option value="CONTRA_PEDIDO">Servicio Contra Pedido</option>
            </select>
          </div>
        </div>

        <div class="module-notice-banner" style="margin-top: 10px;">
          <strong style="color: var(--accent-blue); font-size: 0.85rem;">Consumo Just-in-Time:</strong>
          <p style="color: var(--text-sub); font-size: 0.75rem; margin-top: 2px;">
            Al avanzar cada etapa, se descontará automáticamente el stock real de <code>mod_biz_items</code>.
          </p>
        </div>

        <div class="form-actions" style="margin-top: 18px;">
          <button type="button" class="btn-secondary" id="btnCancelNewOrder">Cancelar</button>
          <button type="submit" class="btn-primary">Lanzar Fabricación</button>
        </div>
      </form>
    </div>
  </template>

  <!-- 4. VISTA DE RUTAS -->
  <template id="tmpl-routes-view">
    <div class="card-header-bar" style="margin-bottom: 14px;">
      <h2 style="font-size: 1.1rem; color: #fff; font-weight: 800;">Rutas Operativas</h2>
      <button type="button" class="btn-icon" id="btnBackHomeRoutes">←</button>
    </div>

    <div style="margin-bottom: 14px;">
      <button id="btnGoNewRoute" class="btn-primary" style="width: 100%;">+ Nueva Ruta de Trabajo</button>
    </div>

    <div id="routesListContainer" class="orders-list"></div>
  </template>

  <!-- 5. FORMULARIO CREAR RUTA CON SELECCIÓN DE MATERIAS PRIMAS -->
  <template id="tmpl-new-route-form-view">
    <div class="card">
      <div class="card-header-bar" style="margin-bottom: 14px;">
        <h2 class="card-title">Crear Ruta de Proceso</h2>
        <button type="button" class="btn-icon" id="btnBackToRoutes">←</button>
      </div>

      <form id="newRouteForm">
        <div class="form-group">
          <label>Nombre de la Ruta:</label>
          <input type="text" id="routeNombre" class="input-field" required placeholder="Ej: Fritura de Empanadas, Lavado General">
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Producto o Servicio Final:</label>
            <select id="routeMaterialId" class="input-field" required></select>
          </div>
          <div class="form-group">
            <label>Tipo de Operación:</label>
            <select id="routeTipoFlujo" class="input-field">
              <option value="VENTA_DIRECTA_LOTE">Producción en Lote para Vitrina</option>
              <option value="CONTRA_PEDIDO">Servicio / Pedido Específico</option>
            </select>
          </div>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border); margin: 16px 0;">
        <h3 style="font-size: 0.85rem; color: var(--accent-gold); margin-bottom: 8px;">Etapas Secuenciales & Insumos Reales</h3>
        <div id="routeStepsContainer" style="display: flex; flex-direction: column; gap: 10px;"></div>

        <button type="button" class="btn-secondary" id="btnAddStepRow" style="width: 100%; margin-top: 6px;">
          + Añadir Siguiente Etapa
        </button>

        <div class="form-actions" style="margin-top: 18px;">
          <button type="button" class="btn-secondary" id="btnCancelRoute">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar Ruta</button>
        </div>
      </form>
    </div>
  </template>

  <script type="module" src="js/app.js?v=20261001_1"></script>
</body>
</html>
