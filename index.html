<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kora Fabricación</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/gh/KoraDevsOrg/kora-web-sdk@main/kora-sync.js"></script>
</head>
<body>

  <!-- Backdrop accesible del Drawer -->
  <div id="drawerBackdrop" class="drawer-backdrop"></div>

  <!-- Drawer Lateral -->
  <aside id="sideDrawer" class="side-drawer"></aside>

  <!-- Encabezado Principal idéntico a Inventario -->
  <header>
    <div class="header-left">
      <button id="btnOpenDrawer" class="btn-hamburger" aria-label="Abrir Menú">☰</button>
      <h1 class="header-title" id="headerTitle">Kora Fabricación</h1>
    </div>
    <div class="offline-badge">100% Offline</div>
  </header>

  <!-- Contenedor Principal dinámico -->
  <main id="appContent"></main>

  <!-- ========================================== -->
  <!-- TEMPLATES DECLARATIVOS                     -->
  <!-- ========================================== -->

  <!-- 1. HUB TÁCTIL PRINCIPAL (Calco exacto de kora-inventario) -->
  <template id="tmpl-home-view">
    <div class="hub-grid">
      <div class="hub-card" id="btnActionActiveOrders">
        <div class="hub-icon-box icon-box-blue">⚡</div>
        <div class="hub-info">
          <div class="hub-title">Órdenes en Taller / Proceso</div>
          <div class="hub-desc">Ver órdenes en ejecución, cronometrar etapas en vivo y notificar avances.</div>
        </div>
        <div class="hub-arrow">➔</div>
      </div>

      <div class="hub-card" id="btnActionNewOrder">
        <div class="hub-icon-box icon-box-gold">➕</div>
        <div class="hub-info">
          <div class="hub-title">Crear Orden de Fabricación</div>
          <div class="hub-desc">Lanzar orden congelando snapshot de materiales (BOM) y ruta operativa.</div>
        </div>
        <div class="hub-arrow">➔</div>
      </div>

      <div class="hub-card" id="btnActionRoutes">
        <div class="hub-icon-box icon-box-purple">📐</div>
        <div class="hub-info">
          <div class="hub-title">Rutas de Proceso & Pasos</div>
          <div class="hub-desc">Definir secuencias operativas y qué materias primas se consumen por etapa.</div>
        </div>
        <div class="hub-arrow">➔</div>
      </div>
    </div>
  </template>

  <!-- 2. VISTA: TABLERO DE ÓRDENES ACTIVAS -->
  <template id="tmpl-active-orders-view">
    <div class="card-header-bar">
      <h2 style="font-size: 1.15rem; color: #fff; font-weight: 800;">Órdenes de Trabajo</h2>
      <button type="button" class="btn-icon" id="btnBackHomeOrders">←</button>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 16px;">
      <button id="btnFilterActive" class="btn-secondary btn-sm active" style="flex: 1;">En Proceso</button>
      <button id="btnFilterDone" class="btn-secondary btn-sm" style="flex: 1;">Finalizadas</button>
    </div>

    <div id="ordersCardsContainer" style="display: flex; flex-direction: column; gap: 14px;"></div>
  </template>

  <!-- 3. FORMULARIO: CREAR NUEVA ORDEN -->
  <template id="tmpl-new-order-view">
    <div class="card">
      <div class="card-header-bar">
        <h2 style="font-size: 1.15rem; color: #fff; font-weight: 800;">Lanzar Orden de Fabricación</h2>
        <button type="button" class="btn-icon" id="btnBackHomeNewOrder">←</button>
      </div>

      <form id="newOrderForm">
        <div class="form-group">
          <label>Identificador o Código de Seguimiento:</label>
          <input type="text" id="ordCodigo" class="input-field" required placeholder="Ej: LOTE-50, PLACA-XYZ123, PEDIDO-08">
        </div>

        <div class="form-group">
          <label>Ruta Operativa:</label>
          <select id="ordRutaId" class="input-field" required></select>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Cantidad a Producir / Lote:</label>
            <input type="number" step="any" id="ordCantidad" class="input-field" value="20" min="1" required>
          </div>
          <div class="form-group">
            <label>Tipo de Flujo:</label>
            <select id="ordTipoFlujo" class="input-field">
              <option value="VENTA_DIRECTA_LOTE">Producción en Lote</option>
              <option value="CONTRA_PEDIDO">Servicio Contra Pedido</option>
            </select>
          </div>
        </div>

        <div style="background: rgba(59, 130, 246, 0.08); border: 1px solid rgba(59, 130, 246, 0.25); border-radius: 10px; padding: 12px; margin-top: 10px;">
          <strong style="color: var(--accent-blue); font-size: 0.85rem;">Enlace con Inventario y RRHH:</strong>
          <p style="color: var(--text-sub); font-size: 0.75rem; margin-top: 4px; line-height: 1.35;">
            Los insumos se descontarán de la tabla <code>mod_biz_items</code> automáticamente al completar cada etapa, y el costo de mano de obra se liquidará con los operarios de <code>mod_hr_empleados</code>.
          </p>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button type="button" class="btn-secondary" id="btnCancelNewOrder" style="flex: 1;">Cancelar</button>
          <button type="submit" class="btn-primary" style="flex: 1;">Lanzar a Fabricación</button>
        </div>
      </form>
    </div>
  </template>

  <!-- 4. VISTA: RUTAS CONFIGURADAS -->
  <template id="tmpl-routes-view">
    <div class="card-header-bar">
      <h2 style="font-size: 1.15rem; color: #fff; font-weight: 800;">Rutas Operativas</h2>
      <button type="button" class="btn-icon" id="btnBackHomeRoutes">←</button>
    </div>

    <button id="btnGoNewRoute" class="btn-primary" style="margin-bottom: 16px;">+ Nueva Ruta de Trabajo</button>
    <div id="routesListContainer" style="display: flex; flex-direction: column; gap: 12px;"></div>
  </template>

  <!-- 5. FORMULARIO: CREAR RUTA CON ETAPAS E INSUMOS -->
  <template id="tmpl-new-route-form-view">
    <div class="card">
      <div class="card-header-bar">
        <h2 style="font-size: 1.15rem; color: #fff; font-weight: 800;">Crear Ruta de Proceso</h2>
        <button type="button" class="btn-icon" id="btnBackToRoutes">←</button>
      </div>

      <form id="newRouteForm">
        <div class="form-group">
          <label>Nombre de la Ruta:</label>
          <input type="text" id="routeNombre" class="input-field" required placeholder="Ej: Fritura de Empanadas, Lavado General">
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Producto / Servicio a Fabricar:</label>
            <select id="routeMaterialId" class="input-field" required></select>
          </div>
          <div class="form-group">
            <label>Tipo de Operación:</label>
            <select id="routeTipoFlujo" class="input-field">
              <option value="VENTA_DIRECTA_LOTE">Producción en Lote</option>
              <option value="CONTRA_PEDIDO">Servicio Contra Pedido</option>
            </select>
          </div>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-card); margin: 18px 0;">
        <h3 style="font-size: 0.9rem; color: var(--accent-gold); margin-bottom: 10px;">Etapas Secuenciales</h3>
        <div id="routeStepsContainer" style="display: flex; flex-direction: column; gap: 10px;"></div>

        <button type="button" class="btn-secondary" id="btnAddStepRow" style="width: 100%; margin-top: 8px;">
          + Añadir Siguiente Etapa
        </button>

        <div style="display: flex; gap: 10px; margin-top: 22px;">
          <button type="button" class="btn-secondary" id="btnCancelRoute" style="flex: 1;">Cancelar</button>
          <button type="submit" class="btn-primary" style="flex: 1;">Guardar Ruta</button>
        </div>
      </form>
    </div>
  </template>

  <!-- Controlador Modular (MVC) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
